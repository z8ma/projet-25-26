<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNY - Maintenance en cours</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0a1a;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(139, 92, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 80% at 80% 20%, rgba(99, 102, 241, 0.12), transparent),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(168, 85, 247, 0.08), transparent);
      animation: pulse-bg 8s ease-in-out infinite alternate;
    }

    @keyframes pulse-bg {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Floating particles */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      animation: float linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; width: 3px; height: 3px; }
    .particle:nth-child(2) { left: 25%; animation-duration: 15s; animation-delay: 2s; width: 5px; height: 5px; }
    .particle:nth-child(3) { left: 40%; animation-duration: 10s; animation-delay: 4s; }
    .particle:nth-child(4) { left: 55%; animation-duration: 14s; animation-delay: 1s; width: 6px; height: 6px; }
    .particle:nth-child(5) { left: 70%; animation-duration: 11s; animation-delay: 3s; width: 3px; height: 3px; }
    .particle:nth-child(6) { left: 85%; animation-duration: 13s; animation-delay: 5s; }
    .particle:nth-child(7) { left: 50%; animation-duration: 16s; animation-delay: 0.5s; width: 5px; height: 5px; }
    .particle:nth-child(8) { left: 15%; animation-duration: 9s; animation-delay: 3.5s; width: 4px; height: 4px; }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 2.5rem;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .logo-wrap img {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
      animation: logo-glow 3s ease-in-out infinite alternate;
    }

    @keyframes logo-glow {
      0% { filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.3)); }
      100% { filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6)); }
    }

    .logo-text {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #6366f1, #a855f7);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Wrench animation */
    .icon-wrap {
      margin-bottom: 2rem;
    }

    .wrench-icon {
      width: 64px;
      height: 64px;
      color: rgba(139, 92, 246, 0.7);
      animation: wrench-turn 3s ease-in-out infinite;
    }

    @keyframes wrench-turn {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f0f5;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #9a95ad;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    /* Progress bar */
    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(139, 92, 246, 0.15);
      border-radius: 4px;
      margin: 0 auto 2rem;
      overflow: hidden;
    }

    .progress-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #6366f1);
      border-radius: 4px;
      animation: progress-move 2s ease-in-out infinite;
    }

    @keyframes progress-move {
      0% { transform: translateX(-100%); width: 40%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 40%; }
    }

    .footer-text {
      font-size: 0.8rem;
      color: #5a5470;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="logo-wrap">
      <img src="logo.png" alt="JUNY">
      <span class="logo-text">JUNY</span>
    </div>

    <div class="icon-wrap">
      <svg class="wrench-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.049.58.025 1.193-.14 1.743" />
      </svg>
    </div>

    <h1>Travaux en cours</h1>
    <p class="subtitle">
      Nous travaillons activement pour vous offrir la meilleure expérience.<br>
      Revenez bientôt !
    </p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <p class="footer-text">JUNY &mdash; La plateforme qui connecte créateurs et professionnels</p>
  </div>
</body>
</html>
